<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceDelay - Real-Time Light Speed Delay Between Planets</title>
  <meta name="description" content="How long does it take light to travel from Earth to Mars? Find out the current light-speed delay between any two planets in our solar system. Free API available.">

  <!-- Open Graph -->
  <meta property="og:title" content="SpaceDelay - Light Speed Delay Calculator">
  <meta property="og:description" content="Real-time light-speed delay between planets. Watch the distance change as planets orbit.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://spacedelay.com">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- LED Clock Font (DSEG7 - 7-segment display) -->
  <link href="https://cdn.jsdelivr.net/npm/dseg@0.46.0/css/dseg.css" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1 class="logo">SPACEDELAY</h1>
      <nav class="nav">
        <a href="https://github.com/kalman17/spacedelay" target="_blank" rel="noopener" class="nav-link">GitHub</a>
        <a href="/docs/API.md" class="nav-link">API</a>
      </nav>
    </header>

    <!-- Time Display -->
    <section class="time-section">
      <div class="time-display-wrapper">
        <!-- Normal date/time display (clickable to edit date) -->
        <div class="time-display" id="time-display-normal">
          <span id="current-date" class="clickable-date" title="Click to set custom date">2026-02-02</span>
          <span id="current-time">00:00:00</span>
          <span class="utc-label">UTC</span>
        </div>
        <!-- Date input mode (hidden by default) -->
        <div class="date-input-wrapper" id="date-input-wrapper" style="display: none;">
          <input type="text" id="date-year" class="date-input" maxlength="4" placeholder="YYYY" autocomplete="off">
          <span class="date-separator">-</span>
          <input type="text" id="date-month" class="date-input" maxlength="2" placeholder="MM" autocomplete="off">
          <span class="date-separator">-</span>
          <input type="text" id="date-day" class="date-input" maxlength="2" placeholder="DD" autocomplete="off">
          <button class="date-submit-btn" id="date-submit-btn" title="Set date">&#10003;</button>
          <button class="date-cancel-btn" id="date-cancel-btn" title="Cancel (Esc)">&#10005;</button>
        </div>
        <div class="date-error" id="date-error"></div>
      </div>
      <button class="live-indicator" id="live-button" title="Return to live time">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </button>
    </section>

    <hr class="divider">

    <!-- Body Selectors -->
    <section class="selectors">
      <div class="selector-group">
        <label for="body-from" class="sr-only">From body</label>
        <select id="body-from" class="body-select">
          <!-- Populated by JS -->
        </select>
      </div>
      <div class="selector-arrow">
        <span>&#8596;</span>
      </div>
      <div class="selector-group">
        <label for="body-to" class="sr-only">To body</label>
        <select id="body-to" class="body-select">
          <!-- Populated by JS -->
        </select>
      </div>
    </section>

    <!-- Context sentence - above -->
    <p class="delay-context">A signal emitted from <strong id="context-from">Earth</strong> would take ...</p>

    <!-- Light Delay Display - NASA Countdown Clock Style -->
    <section class="delay-section">
      <div class="nasa-clock" id="delay-display">
        <div class="clock-group">
          <div class="digit-pair">
            <span class="digit" id="hour-1">0</span>
            <span class="digit" id="hour-2">0</span>
          </div>
          <span class="clock-label">HOUR</span>
        </div>
        <span class="clock-separator" id="sep-hm">:</span>
        <div class="clock-group">
          <div class="digit-pair">
            <span class="digit" id="min-1">0</span>
            <span class="digit" id="min-2">0</span>
          </div>
          <span class="clock-label">MINUTE</span>
        </div>
        <span class="clock-separator" id="sep-ms">:</span>
        <div class="clock-group">
          <div class="digit-pair">
            <span class="digit" id="sec-1">0</span>
            <span class="digit" id="sec-2">0</span>
          </div>
          <span class="clock-label">SECOND</span>
        </div>
        <span class="clock-separator clock-separator-small">.</span>
        <div class="clock-group clock-group-small">
          <div class="digit-pair">
            <span class="digit digit-small" id="tenth">0</span>
            <span class="digit digit-small" id="hundredth">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Context sentence - below -->
    <p class="delay-context">... to reach <strong id="context-to">Mars</strong>.</p>

    <!-- Distance Display -->
    <section class="distance-section">
      <div class="distance-km">
        <span id="distance-value">---</span>
        <span class="unit">km</span>
      </div>
      <div class="distance-au">
        <span id="distance-au-value">---</span>
        <span class="unit">AU</span>
      </div>
    </section>

    <!-- Solar System Map -->
    <section class="map-section">
      <canvas id="solar-map" width="800" height="800"></canvas>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p class="footer-text">Distance updates in real-time as planets orbit.</p>
      <p class="footer-credits">
        Data: <a href="https://ssd.jpl.nasa.gov/" target="_blank" rel="noopener">NASA JPL</a> |
        <a href="https://github.com/kalman17/spacedelay" target="_blank" rel="noopener">Open Source</a>
      </p>
    </footer>
  </div>

  <script src="/app.js?v=5"></script>
  <noscript>
    <div style="padding: 2rem; text-align: center; color: #e0e0e0;">
      <p>Light from Earth to Mars takes approximately 3-22 minutes depending on orbital positions.</p>
      <p>Use our free API: <a href="https://spacedelay.com/api/distance?from=earth&to=mars" style="color: #00d4ff;">spacedelay.com/api/distance?from=earth&to=mars</a></p>
    </div>
  </noscript>
</body>
</html>
